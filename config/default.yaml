# 复制目标：TRSS-Yunzai/config/aiEnhance.yaml
enabled: true

trigger:
  # 私聊消息在原有插件未处理时交给 AI。
  privateEnabled: true
  # 群聊必须 @机器人 或使用机器人别名，避免 onlyReplyAt=0 时回复每句话。
  requireAtInGroup: true
  allowAliasInGroup: true
  # 留空表示所有群；填写后只在指定群启用。
  enabledGroups: []
  disabledGroups: []

api:
  # 可填写 OpenAI 官方地址或任意兼容 Chat Completions 的地址。
  baseUrl: https://api.openai.com/v1
  endpoint: /chat/completions
  # 推荐使用 apiKeyEnv，不要把密钥提交到 Git。
  apiKey: ""
  apiKeyEnv: OPENAI_API_KEY
  allowUnauthenticated: false
  allowInsecureHttp: false
  model: ""
  timeoutMs: 20000
  retries: 1
  temperature: 0.2
  maxTokens: 900
  # 兼容服务通常使用 max_tokens；部分新模型要求 max_completion_tokens。
  maxTokensField: max_tokens
  # auto 会依次尝试 json_schema、json_object、纯提示词 JSON。
  responseFormat: auto
  extraHeaders: {}

vision:
  # 将图片消息下载后转成 OpenAI Chat Completions 的 data URL 输入。
  enabled: true
  maxImages: 3
  maxBytesPerImage: 5242880
  timeoutMs: 10000
  # 可选：auto、low、high、original；auto 会省略 detail 字段以提高兼容性。
  detail: auto
  # 默认只读取 HTTPS 图片；仅在可信环境确有需要时开启。
  allowInsecureHttp: false

knowledge:
  # 针对“角色带什么装备、怎么配装”等问题，后台读取对应攻略图后回答。
  enabled: true
  guideVisionEnabled: true
  # 留空时使用 api.model；可单独指定更擅长读取攻略图的视觉模型。
  model: ""
  # 低于此置信度或攻略图没有明确依据时，不发送模型答案。
  minConfidence: 0.78
  maxGuideImages: 2
  maxBytesPerImage: 10485760
  imageTimeoutMs: 15000
  guideTimeoutMs: 45000
  # 攻略图文字较密，默认使用 high；兼容接口不接受 detail 时可改为 auto。
  detail: high
  temperature: 0.1
  maxTokens: 900

  webSearch:
    # 攻略图无法回答时，使用当前模型在 Responses API 中的原生 web_search。
    enabled: true
    # 留空时复用 api.baseUrl。
    baseUrl: ""
    # 留空时使用 /responses。
    endpoint: ""
    # 留空时复用主 API Key。
    apiKey: ""
    apiKeyEnv: ""
    # 留空时复用 api.model。
    model: ""
    timeoutMs: 25000
    maxResults: 5
    # 留空表示不限制；填写域名后只采用这些网站及其子域名。
    allowedDomains: []
    allowInsecureHttp: false
    extraHeaders: {}

routing:
  topK: 12
  maxInputChars: 2000
  autoExecuteEnabled: true
  autoExecuteConfidence: 0.92
  confirmConfidence: 0.65
  minAutoRetrievalScore: 0.18
  minAutoRetrievalMargin: 0.06

commands:
  enabledPresets:
    - miao
    - waves
    - xiaoyao
  disabledIds: []
  # 自动兼容上一版本尚未包含攻略候选的默认白名单；自定义过白名单时不会改动。
  migrateLegacyAllowlist: true
  # 只有同时出现在这里、且候选本身标记为只读安全，才允许自动执行。
  autoExecuteAllowlist:
    - miao.help
    - miao.genshin_calendar
    - miao.starrail_calendar
    - miao.zzz_calendar
    - miao.today_material
    - miao.profile_list
    - miao.profile_detail
    - genshin.guide
    - starrail.guide
    - miao.profile_stats
    - miao.gacha_summary
    - miao.character_ownership
    - miao.abyss_usage
    - miao.abyss_teams
    - miao.abyss_data
    - miao.theater_data
    - miao.stygian_data
    - waves.help
    - waves.login_help
    - waves.sanity
    - waves.card
    - waves.explore
    - waves.challenge
    - waves.tower
    - waves.profile
    - waves.guide
    - waves.atlas
    - waves.calendar
    - waves.news
    - waves.gacha_records
    - waves.data_bank
    - waves.training
    - waves.sign_records
    - waves.redemption_codes
    - waves.resource_report
    - waves.character_ownership
    - xiaoyao.help
    - xiaoyao.version
    - xiaoyao.stamina
    - xiaoyao.atlas
    - xiaoyao.map_location
    - xiaoyao.account_help
  # 自定义项只支持固定命令；有参数的命令请通过代码添加受限模板。
  custom: []

memory:
  enabled: true
  ttlSeconds: 900
  maxMessages: 8
  maxMessageChars: 1000

limits:
  perUserRequests: 6
  perUserWindowSeconds: 60
  globalConcurrency: 3

reply:
  quote: true
  useButtons: true
  emptyPrompt: 你可以直接和我聊天，也可以告诉我想查询什么。
  notConfigured: AI 服务尚未配置，请主人设置 config/aiEnhance.yaml。
  apiError: AI 服务暂时不可用，请稍后再试。
  imageError: 图片读取失败，请重新发送图片后再试。
  visionDisabled: 当前未开启图片识别，请先在配置中启用 vision.enabled。
  visionUnsupported: 当前模型或兼容 API 可能不支持图片输入，请更换支持视觉的模型后再试。
  knowledgeUnavailable: 当前没有找到能可靠回答这个角色问题的攻略资料，我也没有可发送的攻略图。
  tooLong: 消息太长了，请精简后再试。
  busy: 当前请求较多，请稍后再试。
  sensitive: 检测到消息可能包含 Token、Cookie 或密钥。为保护账号安全，这条消息不会发送给 AI，请在私聊中使用准确的原插件命令。

logging:
  decisions: true
